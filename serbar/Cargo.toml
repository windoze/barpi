[package]
name = "serbar"
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-serial = { version = "5", features = ["libudev"] }
tokio-util = "0.7"
clap = { version = "4", features = ["derive", "env"] }

arboard = { version = "3.4", features = ["wayland-data-control"], optional = true }

barrier-client = { path = "../barrier-client", default-features = false, features = ["barrier-options"] }
synergy-hid = { path = "../synergy-hid" }

[features]
default = ["clipboard"]
# This feature needs access to the clipboard, thus needs GUI environment.
# Turn it off if you want to use the service without GUI, e.g. on a terminal-only server.
clipboard = ["barrier-client/clipboard", "dep:arboard"]
